name: Build desktop release packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
      platform:
        description: Desktop platform to build
        type: choice
        default: both
        options:
          - both
          - windows
          - linux

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Install Flutter SDK
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libjson-glib-dev xvfb
      - name: Analyze and test
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-fatal-infos --no-fatal-warnings
          # Live YouTube checks depend on whether the provider serves the runner IP.
          # Run these locally with an unfiltered flutter test.
          xvfb-run -a flutter test --timeout 10m --name '^(?!.*(?:Multi-language audio extraction|Thumbnail download saves genuine file|4K and 2K formats are present|YouTube Extractor extracts real streams|Live audio stream dynamic resolution|Live movie stream dynamic resolution|Video download starts and streams genuine bytes))'

  windows:
    needs: verify
    if: inputs.platform != 'linux'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Install Flutter SDK
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP/flutter/bin" >> $env:GITHUB_PATH
      - name: Build and package Windows x64
        shell: pwsh
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $folder = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $app = Start-Process -FilePath (Join-Path $folder 'snaptube_pure.exe') -WorkingDirectory $folder -PassThru
          try {
            Start-Sleep -Seconds 15
            $app.Refresh()
            if ($app.HasExited -or $app.MainWindowHandle -eq 0) { throw 'Windows app did not open a window' }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }
          $tag = git describe --tags --exact-match
          Compress-Archive -Path "$folder/*" -DestinationPath "all-in-one-$tag-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: all-in-one-*-windows-x64.zip
          if-no-files-found: error

  linux:
    needs: verify
    if: inputs.platform != 'windows'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libjson-glib-dev xvfb xdotool x11-utils dbus-x11
      - name: Install Flutter SDK
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build and package Linux x64
        run: |
          flutter pub get --enforce-lockfile
          flutter build linux --release --no-pub
          bundle=build/linux/x64/release/bundle
          LIBGL_ALWAYS_SOFTWARE=1 GDK_BACKEND=x11 NO_AT_BRIDGE=1 xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash -s "$bundle" <<'EOF'
          set -euo pipefail
          "$1/snaptube_pure" > desktop-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          if ! timeout 45s xdotool search --sync --onlyvisible --name '^(All in One|Tub Pure)$' >/dev/null; then
            xwininfo -root -tree
            cat desktop-smoke.log
            exit 1
          fi
          sleep 5
          kill -0 "$pid" || { cat desktop-smoke.log; exit 1; }
          EOF
          tag="$(git describe --tags --exact-match)"
          tar -czf "all-in-one-$tag-linux-x64.tar.gz" -C "$bundle" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: all-in-one-*-linux-x64.tar.gz
          if-no-files-found: error
